[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.5.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude (project headers) is suppressed alongside missingIncludeSystem: on a
; fresh CI checkout cppcheck has no resolved include paths, so it reports every
; project header as missing (~400 information-level lines) and fails the job.
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
# MEMFIX-PORT: single-precision ECC (sp_c32.c). Without it every P-256 operation
# (TLS 1.3 key_share keygen, ECDHE, ECDSA cert verify) runs on fast-math bignums
# that WOLFSSL_SMALL_STACK heap-allocates at FP_MAX_BITS size -- tens of KB of
# temporaries, which OOMs (MP_MEM) at the ~50KB free heap a reading session
# leaves. SP uses fixed 256-bit arrays: a few KB, and several times faster.
# SP_SMALL trades the large precomputed point tables for smaller flash.
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_SMALL
# Arduino-wolfSSL's user_settings.h enables TLS extensions, supported curves,
# HKDF, and RSA-PSS when WOLFSSL_TLS13 is set. Do not repeat those defines here:
# GCC reports every library translation unit as a macro redefinition.
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; MEMFIX-PORT: custom_sdkconfig heap reclamation (~32-37 KB). Rebuilds the
; Arduino core libs on first build (slower once, cached after; needs the CMake
; pin in platformio.local.ini on macOS).
;
; If an interrupted rebuild fails with "multiple definition of 'app_main'"
; (stale generated scaffold), clean it up with:
;   rm -rf .dummy CMakeLists.txt sdkconfig.default sdkconfig.defaults .pio/build/default
; Do NOT use `git clean -fdX` — it deletes platformio.local.ini.
custom_sdkconfig =
  ; Task stack right-sizing from measured high-water marks (heap block map +
  ; per-task stack audit, July 2026): esp_timer used ~0.8 KB of 8 KB across
  ; every capture; the FreeRTOS timer service used ~0.5 KB
  ; of 4 KB. Neither runs TLS or app code. ~7 KB back to the heap.
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  ; Move the WiFi stack's non-critical hot paths out of IRAM into flash.
  ; On the C3, IRAM and DRAM share one SRAM pool, so the ~25-30 KB this
  ; frees lands directly in the heap — paid for with lower WiFi throughput
  ; during transfers (occasional sync/OTA use, not streaming: acceptable).
  ; IRAM cost is static, so the heap gain applies even with WiFi off.
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  ; Tried and reverted: trimming CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM (10->4),
  ; DYNAMIC_RX_BUFFER_NUM (32->16), RX_MGMT_BUF_NUM_DEF (5->3). Measured on
  ; real hardware with BLE connected: free heap during TLS handshake moved
  ; from ~7-8KB to ~9.2KB -- barely closes the ~26KB gap to the ~35KB TLS
  ; needs. These are small static buffers (a few KB total combined); not
  ; worth the throughput/margin trade-off for that little gain. The real
  ; cost is BLE's own ~55KB init-time heap reservation -- see the BLE
  ; controller section below and BleNotifyRelay's pause()/resume().
  ; Keep the Arduino wrappers for the removed cloud components (below) out of
  ; the core source list; all other bundled libraries default to enabled.
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  ; ESP_SR (speech recognition) only exists in the S3 core; its wrapper includes
  ; ESP_I2S.h, which the isolated core rebuild can't resolve. Unused here anyway,
  ; so drop it or the sticky env fails to build.
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

; Drop unused cloud components from the core rebuild. esp_insights/rainmaker
; require embedded server certs the lib builder can't generate
; ("https_server.crt.S not found"); this firmware uses none of them.
custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/gen_companion_sprites.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_nimble.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2

lib_ignore =
  BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  ; --- BLE notification relay spike (dev builds only) -------------------
  -DENABLE_BLE_NOTIFY_SPIKE=1
  ; NimBLE-Arduino's own nimconfig.h does NOT gate central/observer role code
  ; on the ESP-IDF Kconfig names (CONFIG_BT_NIMBLE_ROLE_CENTRAL/OBSERVER) the
  ; way custom_sdkconfig below sets them -- it checks
  ; #ifndef CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED (a different, NimBLE-Arduino
  ; -invented sentinel), defaulting to *enabled* unless that exact name is
  ; defined. Kconfig omits the macro entirely for a disabled bool rather than
  ; emitting an explicit 0, so CONFIG_BT_NIMBLE_ROLE_CENTRAL=n in
  ; custom_sdkconfig was silently a no-op -- confirmed by a real crash:
  ; NimBLEServer::~NimBLEServer() (NimBLEServer.cpp:78) still had its
  ; `#if CONFIG_BT_NIMBLE_ROLE_CENTRAL` central-only cleanup code compiled in,
  ; deleting an m_pClient this peripheral-only app never properly initializes,
  ; crashing with a heap_caps_free assert the first time anything actually
  ; destructed the server (BleNotifyRelay::pause()'s deinit(true)).
  ; This sentinel name is NimBLE-Arduino's own invention, never defined by
  ; ESP-IDF's Kconfig, so -D here is safe -- unlike the plain CONFIG_BT_NIMBLE_*
  ; names, there is no sdkconfig.h line to redefine against.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

lib_deps =
  ${base.lib_deps}
  h2zero/NimBLE-Arduino @ ^2.3.8

; MEMFIX-PORT: custom_sdkconfig extends (not replaces) [base]'s own. Trims
; NimBLE's ESP-IDF Kconfig defaults (see the comment on the BLE build_flags
; above) down to what this feature actually needs, in real Kconfig y/n/numeric
; syntax rather than the -D flags that fought the existing sdkconfig.h.
custom_sdkconfig =
  ${base.custom_sdkconfig}
  ; WiFi/BLE coexistence: CONFIG_ESP_COEX_SW_COEXIST_ENABLE (esp_coex/Kconfig)
  ; -- the software arbiter for WiFi and Bluetooth sharing this chip's single
  ; 2.4GHz radio -- depends on CONFIG_BT_ENABLED (bt/Kconfig), which has no
  ; default and nothing else in this project selects. NimBLE-Arduino bypasses
  ; ESP-IDF's own bt component entirely (it vendors its own stack), so BLE
  ; itself works without this -- but coexistence arbitration between WiFi and
  ; BLE never gets configured as a result, unless this is set explicitly.
  ; Confirmed in the generated sdkconfig.h: this does make
  ; CONFIG_ESP_COEX_SW_COEXIST_ENABLE=1 appear, which it did not before.
  CONFIG_BT_ENABLED=y
  ; Peripheral + broadcaster only (advertise, accept one incoming connection;
  ; never scan for or connect out to anything). PERIPHERAL/BROADCASTER=y work
  ; as Kconfig bools normally would. CENTRAL/OBSERVER=n alone do NOT, per the
  ; build_flags CONFIG_BT_NIMBLE_ROLE_*_DISABLED comment below -- but removing
  ; these two lines entirely made it worse, not better: BT_NIMBLE_ROLE_CENTRAL
  ; has an unconditional `default y` in Kconfig.in, so omitting an override
  ; here just lets that default emit an explicit 1 in sdkconfig.h, which stops
  ; nimconfig.h's #ifndef check (that the _DISABLED flag depends on) from ever
  ; running. Keeping =n here (to prevent that default from winning) AND the
  ; _DISABLED build flag (for nimconfig.h's own fallback logic) are both
  ; required together.
  CONFIG_BT_NIMBLE_ROLE_CENTRAL=n
  CONFIG_BT_NIMBLE_ROLE_OBSERVER=n
  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=y
  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=y
  ; One phone, one connection -- this is the whole point of the feature.
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  ; No pairing/bonding: Nordic UART Service is unauthenticated by design (see
  ; BleNotifyRelay's own comment), and the code never calls
  ; NimBLEDevice::setSecurityAuth(), so bonding is never actually negotiated --
  ; 1 keeps the (tiny) reserved bond-storage array minimal without relying on
  ; an unverified 0 being accepted everywhere.
  CONFIG_BT_NIMBLE_MAX_BONDS=1
  ; Exactly one characteristic supports NOTIFY (the device->phone side); that
  ; is the only CCCD subscription this peripheral can ever hold.
  CONFIG_BT_NIMBLE_MAX_CCCDS=1
  ;
  ; This project builds BLE via h2zero/NimBLE-Arduino, which bundles its own
  ; self-contained vendored nimble stack rather than routing through ESP-IDF's
  ; native bt/host/nimble component. Its actual config bridge is
  ; NimBLE-Arduino/src/nimble/esp_port/port/include/esp_nimble_cfg.h
  ; (translates CONFIG_BT_NIMBLE_* into the MYNEWT_VAL_* names the vendored
  ; nimble host source checks), included via .../porting/nimble/include/
  ; syscfg/syscfg.h. Only settings that file actually references have any
  ; effect at all -- every line below was checked directly against it
  ; (`grep` for the macro name in that specific file, not just "does
  ; sdkconfig.h define it") before being added.
  ;
  ; No BLE5 extended-advertising/scanning, periodic sync, or 2M/coded PHY --
  ; legacy advertising only, and ROLE_OBSERVER=n above already rules out
  ; scanning.
  CONFIG_BT_NIMBLE_50_FEATURE_SUPPORT=n
  ; Preferred MTU matches what actually gets negotiated in practice (logs
  ; show 20-byte write payloads = 23-byte ATT MTU, the BLE default). Small
  ; effect: it sizes a per-instance buffer in NimBLEStream.h, not a static
  ; one, so this is a minor win, not the free-for-all it might look like.
  CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=23
  ; Tried and reverted: CONFIG_BT_NIMBLE_SM_LEGACY=n, SM_SC=n,
  ; LL_CFG_FEAT_LE_ENCRYPTION=n, CRYPTO_STACK_MBEDTLS=n. Each is real
  ; (referenced in esp_nimble_cfg.h) and this feature never uses pairing/
  ; encryption, so logically these looked like a win -- but measured flash
  ; went UP by ~3.4KB with all four applied together, not down. Likely
  ; cause: this project's WiFi stack already forces mbedTLS's crypto
  ; primitives into the build regardless, so disabling NimBLE's own
  ; mbedTLS selection doesn't remove mbedTLS -- it just makes NimBLE
  ; additionally compile in its own bundled TinyCrypt as a second, unused
  ; crypto implementation. Not verified further (would need another
  ; from-scratch rebuild to isolate); reverted on the measured regression
  ; alone rather than chase it further.
  ; Whitelist filtering is never used -- this peripheral never scans
  ; (ROLE_OBSERVER=n above) and accepts any central that connects to its
  ; advertisement. Range is 1-15; 1 is the minimum.
  CONFIG_BT_NIMBLE_WHITELIST_SIZE=1
  ; The msys_1 pool exists specifically for the ATT prepare-write/
  ; execute-write ("long write") procedure (see this option's own help
  ; text in Kconfig.in) -- this feature only ever sends single writes
  ; under the negotiated MTU, so that procedure never runs. Trimmed, not
  ; zeroed, since nothing here rules out some other minor internal use.
  CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=3
  ; NimBLE's own internal host log verbosity (separate from this project's
  ; LOG_LEVEL build flag, which only controls this firmware's own LOG_INF/
  ; LOG_ERR calls) -- dropped from its default INFO to ERROR, trimming
  ; info-level log format strings while this feature is still under active
  ; development and worth keeping error visibility for.
  CONFIG_BT_NIMBLE_LOG_LEVEL_ERROR=y
  ;
  ; Deliberately NOT touched, despite being real (referenced) knobs:
  ; - MSYS_2_BLOCK_COUNT/SIZE and the TRANSPORT_ACL_*/TRANSPORT_EVT_* HCI
  ;   buffer pools: these are the actual data-path buffers. A live capture
  ;   this session showed a single Gadgetbridge notification fragmenting
  ;   into ~9-10 sequential 20-byte writes -- cutting these pools without
  ;   a real burst-notification stress test on hardware risks silently
  ;   dropped data, not a crash that would be caught if wrong.
  ; - GATT_MAX_PROCS: reducing this safely needs visibility into how many
  ;   GATT procedures actually run concurrently during connection setup
  ;   (MTU exchange, discovery, our own writes/notifies) that isn't
  ;   available without live instrumentation.
  ; - Host/link-layer task stack sizes: this project's own CLAUDE.md
  ;   methodology for stack sizing is measuring uxTaskGetStackHighWaterMark
  ;   before cutting, which hasn't been done for these tasks.
  ;
  ; --- BLE controller (bt/controller/esp32c3/Kconfig.in) -----------------
  ; Real instrumentation (BleNotifyRelay's bleInitHeapCost/poll() log)
  ; measured NimBLE's true init-time heap cost at 58,112 bytes on real
  ; hardware -- a static binary-size analysis alone (~20KB) had completely
  ; missed this dynamic allocation, so the BLE controller Kconfig (native
  ; ESP-IDF/Espressif code, not NimBLE-Arduino's own bypassed config surface)
  ; looked like a promising place to recover more of it.
  ;
  ; First attempt applied a whole block of these together (RUN_IN_FLASH_ONLY,
  ; BLE_MAX_ACT=2, BLE_SCAN=n, BLE_SCAN_DUPL=n, DTM_ENABLE=n, plus
  ; BLE_SECURITY_ENABLE=n) and broke BLE outright -- advertising::start()
  ; stopped succeeding, confirmed via poll()'s "Status: NOT ACTIVE" on real
  ; hardware, no crash either side. First split test (removing only
  ; BLE_SECURITY_ENABLE) still showed "NOT ACTIVE" -- ruling that one out.
  ; Second split test isolated RUN_IN_FLASH_ONLY completely alone -- still
  ; "NOT ACTIVE". It was present in all three failing configurations tested
  ; (full batch, first split, second split) and absent in none, so it's the
  ; confirmed culprit: likely because BLE's link-layer radio scheduling is
  ; far more latency-sensitive than WiFi's (which already tolerates
  ; CONFIG_ESP_WIFI_IRAM_OPT=n fine) -- moving all controller code from IRAM/
  ; ROM to slower flash-cache execution apparently violates the real-time
  ; timing the scheduler needs to transmit advertising packets on schedule.
  ; Espressif's own doc text warned "performance will decrease"; for this
  ; chip/workload that decrease crossed into outright non-function, not just
  ; slower. Abandoned -- not applied here.
  ;
  ; Third test: the remaining four, none tried without RUN_IN_FLASH_ONLY in
  ; the mix until now. Each documented directly by Espressif or this option's
  ; own Kconfig help text.
  ; Each BLE_MAX_ACT instance costs 828 bytes, covering connections, scan,
  ; sync, and adv (periodic/multi-adv) combined. Default is 6; this feature
  ; only ever runs one advertising instance plus one connection. Kept at 2,
  ; not the theoretical minimum of 1, in case both need to coexist briefly
  ; during the advertising-to-connected transition -- unverified point, kept
  ; conservative rather than guessed at.
  CONFIG_BT_CTRL_BLE_MAX_ACT=2
  ; This peripheral never scans (ROLE_OBSERVER=n above already rules it out
  ; at the host level; this is the same fact at the controller level).
  ; Disabling it also disables BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_SUPP, which
  ; depends on it -- another documented, quantified saving (35 bytes per
  ; buffered advertising report, default 100 = ~3.5KB) for report buffering
  ; this peripheral-only role never uses.
  CONFIG_BT_CTRL_BLE_SCAN=n
  ; Scan-duplicate-filter cache (default 100 devices) -- moot without
  ; scanning, but this option has no explicit `depends on BT_CTRL_BLE_SCAN`
  ; in Kconfig.in, so it's disabled explicitly rather than assumed to
  ; cascade from the setting above.
  CONFIG_BT_CTRL_BLE_SCAN_DUPL=n
  ; RF-certification-only test mode at the controller level (distinct from
  ; the host-level DTM_MODE_TEST tried and confirmed dead earlier) -- never
  ; invoked outside a lab test rig.
  CONFIG_BT_CTRL_DTM_ENABLE=n
  ; NOT touched: RUN_IN_FLASH_ONLY (confirmed culprit, abandoned above),
  ; BLE_SECURITY_ENABLE (ruled out as a lone cause in the first split test,
  ; but not re-added here -- untested in combination with these four). NOT
  ; touched: BT_CTRL_BLE_MASTER ("Enable BLE connection feature") -- despite
  ; its name suggesting central-only relevance, its own help text warns "if
  ; this option is disabled, it is not recommended to use connectable ADV" --
  ; exactly what this feature needs to do as a peripheral, so this is
  ; required regardless of role.


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; --- Seeed Sticky — ESP32-S3R8, 3.97" 800x480 SSD1677 + GT911 touch -----------
; Different MCU family than the C3 envs (one binary per family). The SDK
; auto-enables CAP_TOUCH (GT911) and the BQ27220 gauge for this device; PSRAM is
; intentionally left off (48KB framebuffer fits in DRAM, same as X4).
;   pio run -e sticky -t upload
[env:sticky]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; git_branch.py only injects CROSSPOINT_VERSION for the default env; set it here.
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-sticky\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
